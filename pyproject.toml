[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gan-wafer-defects"
version = "0.1.0"
description = "Offline, explainable detection of small anomalies on near-concentric wafer images"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.8,<5"]

[project.scripts]
wafer-detect = "wafer_defects.cli:main"

[tool.setuptools.packages.find]
include = ["wafer_defects*"]
